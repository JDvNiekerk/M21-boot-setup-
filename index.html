<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>M21 Boat Setup</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:22px 18px}h1{margin:0;font-size:24px}main{padding:16px;max-width:760px;margin:auto}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid #d1d5db;border-radius:10px}button{background:#111827;color:white;border:0;font-weight:700;margin-top:10px}.secondary{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.run{border-top:1px solid #e5e7eb;padding:12px 0}.small{font-size:12px;color:#6b7280}.row{display:flex;gap:8px}.row button{flex:1}.weather{background:#eff6ff}.danger{background:#b91c1c}</style></head><body><header><h1>🏁 M21 Boat Setup</h1><div class="small" style="color:#cbd5e1">Practice & setup logbook</div></header><main><div class="card"><button id="locate">📍 Kry my ligging & weer</button><div id="status" class="small" style="margin-top:8px"></div></div><div class="card weather"><b>Weer vir hierdie sessie</b><div class="grid"><div>Temperatuur<br><b id="temp">—</b> °C</div><div>Wind<br><b id="wind">—</b> km/h</div><div>Windrigting<br><b id="dir">—</b></div><div>Gusts<br><b id="gust">—</b> km/h</div></div><div id="area" class="small" style="margin-top:10px">Ligging nog nie gekry nie</div></div><div class="card"><div class="grid"><div><label>Datum</label><input id="date" type="date"></div><div><label>Tyd</label><input id="time" type="time"></div></div><label>Gebied / plek</label><input id="place" placeholder="bv. Gordon's Bay"> <label>Driver</label><input id="driver" placeholder="Naam"><div class="grid"><div><label>Prop</label><input id="prop" placeholder="bv. 27P"> </div><div><label>Speed (km/h)</label><input id="speed" type="number" step="0.1"></div><div><label>Height / trim</label><input id="height" type="number" step="0.1"></div><div><label>Degrees</label><input id="degrees" type="number" step="0.1"></div></div><label>Water</label><select id="water"><option>Kalm</option><option>Klein chop</option><option>Chop</option><option>Groot chop</option></select><label>Notas</label><textarea id="notes" rows="3" placeholder="Enjin, trim, handling, holeshot, ens."></textarea><button id="save">💾 Stoor run</button></div><div class="card"><h2 style="margin-top:0">Saved runs</h2><div id="runs"></div></div></main><script>const $=id=>document.getElementById(id);let weather={};function now(){let d=new Date();$('date').value=d.toISOString().slice(0,10);$('time').value=d.toTimeString().slice(0,5)}now();function bearing(deg){const dirs=['N','NE','E','SE','S','SW','W','NW'];return dirs[Math.round(deg/45)%8]}async function locate(){if(!navigator.geolocation){$('status').textContent='Ligging word nie deur hierdie foon ondersteun nie.';return}$('status').textContent='Kry ligging en weer…';navigator.geolocation.getCurrentPosition(async p=>{const {latitude:lat,longitude:lon}=p.coords;try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m`);const x=await r.json();weather=x.current;$('temp').textContent=x.current.temperature_2m;$('wind').textContent=x.current.wind_speed_10m;$('dir').textContent=bearing(x.current.wind_direction_10m);$('gust').textContent=x.current.wind_gusts_10m;$('area').textContent=`GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;$('status').textContent='Weer opgedateer.';if(!$('place').value)$('place').value='GPS practice area';}catch(e){$('status').textContent='Kon weer nie kry nie.'}},e=>{$('status').textContent='Ligging toestemming geweier. Laat Location toe in Safari.'},{enableHighAccuracy:true,timeout:10000})}function getRuns(){return JSON.parse(localStorage.getItem('m21runs')||'[]')}function render(){let a=getRuns();$('runs').innerHTML=a.length?a.map((r,i)=>`<div class="run"><b>${r.date} ${r.time} — ${r.place||'Geen plek'}</b><div class="small">${r.driver||''} · Prop ${r.prop||'—'} · ${r.speed||'—'} km/h · Height ${r.height||'—'} · ${r.degrees||'—'}° · ${r.water}</div><div class="small">Weather: ${r.temp??'—'}°C · ${r.wind??'—'} km/h ${r.dir||''} · Gust ${r.gust??'—'}</div><div>${r.notes||''}</div><div class="row"><button class="secondary" onclick="del(${i})">Delete</button></div></div>`).join(''):'<div class="small">Nog geen runs gestoor nie.</div>'}function del(i){let a=getRuns();a.splice(i,1);localStorage.setItem('m21runs',JSON.stringify(a));render()}$('locate').onclick=locate;$('save').onclick=()=>{let a=getRuns();a.unshift({date:$('date').value,time:$('time').value,place:$('place').value,driver:$('driver').value,prop:$('prop').value,speed:$('speed').value,height:$('height').value,degrees:$('degrees').value,water:$('water').value,notes:$('notes').value,temp:weather.temperature_2m,wind:weather.wind_speed_10m,dir:weather.wind_direction_10m!=null?bearing(weather.wind_direction_10m):'',gust:weather.wind_gusts_10m});localStorage.setItem('m21runs',JSON.stringify(a));render();$('status').textContent='Run gestoor.'};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
